# Public, reproducible evidence for openai/codex#27117 and snowyukitty/codex#2:
# on a stock GitHub windows-latest runner this workflow (1) reproduces the
# root cause, (2) shows upstream install.ps1 still fails the regression test,
# and (3) shows the patched install.ps1 passes it under both shells.
name: validate-install-ps1

on:
  push:
    branches: [ci-validation]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Runner shell inventory
        shell: pwsh
        run: |
          "pwsh $($PSVersionTable.PSVersion) / PSModulePath:"
          $env:PSModulePath -split ';'
          powershell.exe -NoProfile -Command '"Windows PowerShell $($PSVersionTable.PSVersion)"'

      - name: Reproduce root cause (pwsh-style PSModulePath -> powershell.exe child)
        shell: pwsh
        run: |
          # Recreate the exact child environment the codex updater produces in the field:
          # powershell.exe 5.1 with pwsh's module directory ahead of the Windows PowerShell ones.
          $ps7Modules = Join-Path $PSHOME 'Modules'
          $winpsModules = Join-Path $env:windir 'System32\WindowsPowerShell1.0\Modules'
          "pwsh-shipped Microsoft.PowerShell.Utility present: $(Test-Path (Join-Path $ps7Modules 'Microsoft.PowerShell.Utility'))"
          $cmd = '$c = Get-Command Get-FileHash -ErrorAction SilentlyContinue; "found=$([bool]$c) source=$($c.Source) version=$($c.Version)"'
          "--- child with runner-inherited environment ---"
          powershell.exe -NoProfile -Command $cmd
          "--- child with pwsh-style PSModulePath (PS7 modules first, as in the field) ---"
          $saved = $env:PSModulePath
          $env:PSModulePath = "$ps7Modules;$winpsModules"
          $probe = powershell.exe -NoProfile -Command $cmd
          $env:PSModulePath = $saved
          $probe
          if ($probe -match 'found=False') {
            "REPRODUCED: with pwsh's module directory ahead of Windows PowerShell's, Get-FileHash no longer resolves in the 5.1 child."
          } else {
            "NOT REPRODUCED on this runner image; continuing - the regression test below is environment-independent."
          }

      - name: Upstream install.ps1 (openai/codex main) fails the regression test
        shell: pwsh
        run: |
          New-Item -ItemType Directory upstream-check | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/openai/codex/main/scripts/install/install.ps1 -OutFile upstream-check/install.ps1
          Copy-Item scripts/install/test_install_ps1.py upstream-check/
          python upstream-check/test_install_ps1.py
          if ($LASTEXITCODE -eq 0) { throw "Expected upstream install.ps1 to fail: it still depends on Get-FileHash." }
          "CONFIRMED: upstream install.ps1 depends on Get-FileHash and fails when the cmdlet is unavailable."
          exit 0

      - name: Patched install.ps1 passes under Windows PowerShell 5.1 and pwsh
        shell: pwsh
        run: python scripts/install/test_install_ps1.py -v
